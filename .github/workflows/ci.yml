name: Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: Quality Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Prettier debug
              run: |
                  bunx prettier --version
                  bunx prettier --find-config-path .prettierrc

            - name: Check formatting
              run: bun x prettier --check .

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run check

            - name: Build
              run: bun run build
